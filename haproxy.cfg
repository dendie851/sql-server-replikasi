global
    log /dev/log local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    retries 3
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend sql_frontend
    bind *:1433
    mode tcp
    default_backend sql_backend

backend sql_backend
    mode tcp
    balance roundrobin
    option tcp-check
    server sql_primary sql_primary:1433 check inter 5s rise 2 fall 3
    server sql_secondary sql_secondary:1433 check inter 5s rise 2 fall 3